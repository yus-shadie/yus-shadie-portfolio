<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Yus Shadie — AI Creator</title>

<meta name="description"
content="Yus Shadie — AI Video Content Creator, Prompter & Mentor Spectrum Academy. Purwakarta, Jawa Barat, Indonesia.">


<style>

/* =========================================================
   YUS SHADIE — PREMIUM AI CREATOR PORTFOLIO
   DARKNESS / GOLD / ELECTRIC BLUE / BATIK / SURREAL
   ========================================================= */

:root{
    --black:#020304;
    --black2:#05070a;
    --black3:#090d12;

    --gold:#d8b45b;
    --gold2:#f5df9b;
    --gold3:#8d6a25;

    --blue:#62e8ff;
    --blue2:#b9f7ff;
    --blue3:#087d9a;

    --white:#f5f7f8;
    --gray:#89939d;

    --red:#5e1724;

    --line:rgba(216,180,91,.24);

    --max:1280px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(
            circle at 85% 15%,
            rgba(0,170,210,.12),
            transparent 28%
        ),
        radial-gradient(
            circle at 10% 70%,
            rgba(216,180,91,.07),
            transparent 25%
        ),
        var(--black);

    color:var(--white);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x:hidden;
}


/* =========================================================
   BACKGROUND DARKNESS
   ========================================================= */

body:before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-10;
    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 25%,
            rgba(0,0,0,.65) 100%
        );
}


/* =========================================================
   BATIK PATTERN
   ========================================================= */

.batik-bg{
    position:fixed;
    inset:0;
    z-index:-9;
    pointer-events:none;

    opacity:.15;

    background-image:

        radial-gradient(
            circle at 50% 50%,
            transparent 0 15px,
            rgba(216,180,91,.22) 16px 17px,
            transparent 18px
        ),

        radial-gradient(
            ellipse at center,
            transparent 0 25px,
            rgba(216,180,91,.13) 26px 27px,
            transparent 28px
        );

    background-size:
        82px 82px,
        125px 125px;

    transform:rotate(8deg);
}


/* =========================================================
   ELECTRIC BLUE SURREAL FLAME
   ========================================================= */

.energy{
    position:fixed;
    z-index:-7;
    pointer-events:none;

    width:420px;
    height:700px;

    opacity:.20;

    filter:blur(18px);

    background:
        radial-gradient(
            ellipse at 50% 80%,
            rgba(98,232,255,.9),
            rgba(8,125,154,.55) 25%,
            transparent 67%
        );

    border-radius:
        48% 52% 42% 58% /
        62% 40% 60% 38%;

    animation:energyMove 10s ease-in-out infinite;
}

.energy.one{
    right:-180px;
    top:8%;
    transform:rotate(-18deg);
}

.energy.two{
    left:-210px;
    bottom:0;
    transform:rotate(22deg);
    animation-delay:-5s;
}

@keyframes energyMove{

    0%,100%{
        transform:
            translateY(0)
            rotate(-18deg)
            scale(1);
    }

    50%{
        transform:
            translateY(-45px)
            rotate(-10deg)
            scale(1.08);
    }
}


/* =========================================================
   NAVIGATION
   ========================================================= */

.nav{
    position:fixed;
    top:0;
    left:0;
    right:0;

    height:76px;

    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 6%;

    background:
        rgba(2,3,4,.86);

    border-bottom:
        1px solid var(--line);

    backdrop-filter:blur(18px);
}

.logo{
    font-family:Georgia,serif;
    font-weight:bold;
    font-size:20px;
    letter-spacing:5px;
}

.logo span{
    color:var(--gold);
}

.nav-links{
    display:flex;
    gap:26px;
}

.nav-links a{
    color:#b8c0c7;
    font-size:9px;
    letter-spacing:2px;
    transition:.3s;
}

.nav-links a:hover{
    color:var(--blue);
}


/* =========================================================
   HERO
   ========================================================= */

.hero{
    min-height:100vh;

    max-width:var(--max);

    margin:auto;

    padding:
        155px 7% 100px;

    display:grid;

    grid-template-columns:
        1.1fr .9fr;

    align-items:center;

    position:relative;
}


/* Decorative circle */

.hero-orbit{
    position:absolute;

    right:3%;
    top:50%;

    width:470px;
    height:470px;

    transform:translateY(-50%);

    border:
        1px solid rgba(216,180,91,.24);

    border-radius:50%;

    box-shadow:
        0 0 100px rgba(98,232,255,.05),
        inset 0 0 80px rgba(216,180,91,.04);
}

.hero-orbit:before{
    content:"";

    position:absolute;
    inset:45px;

    border:
        1px solid rgba(98,232,255,.25);

    border-radius:50%;
}

.hero-orbit:after{
    content:"✦";

    position:absolute;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    color:var(--blue);

    font-size:130px;

    opacity:.20;

    text-shadow:
        0 0 40px var(--blue);
}


/* Hero content */

.hero-content{
    position:relative;
    z-index:3;
}

.eyebrow{
    display:flex;
    align-items:center;
    gap:15px;

    color:var(--blue);

    font-size:10px;

    letter-spacing:5px;

    margin-bottom:30px;
}

.eyebrow:before{
    content:"";

    width:55px;
    height:1px;

    background:var(--gold);
}

.hero h1{
    font-family:Georgia,serif;

    font-size:
        clamp(72px,10vw,150px);

    line-height:.78;

    letter-spacing:-7px;

    margin-bottom:38px;
}

.hero h1 .gold{
    color:var(--gold);

    text-shadow:
        0 0 35px rgba(216,180,91,.15);
}

.hero-role{
    color:var(--blue2);

    font-size:16px;

    font-weight:bold;

    letter-spacing:4px;

    margin-bottom:10px;
}

.hero-mentor{
    color:var(--gold);

    font-size:10px;

    letter-spacing:3px;

    margin-bottom:8px;
}

.hero-location{
    color:var(--gray);

    font-size:9px;

    letter-spacing:3px;
}


/* Hero buttons */

.hero-buttons{
    display:flex;

    gap:12px;

    margin-top:38px;
}

.button{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-width:165px;

    padding:15px 22px;

    font-size:9px;

    letter-spacing:2px;

    transition:.35s;

    border:1px solid var(--line);
}

.button.gold{
    background:var(--gold);
    color:#030303;

    border-color:var(--gold);
}

.button.gold:hover{
    background:var(--gold2);

    box-shadow:
        0 0 35px rgba(216,180,91,.25);

    transform:translateY(-3px);
}

.button.dark{
    color:var(--white);
}

.button.dark:hover{
    color:var(--blue);

    border-color:var(--blue);

    transform:translateY(-3px);
}


/* =========================================================
   GENERAL SECTION
   ========================================================= */

.section{
    max-width:var(--max);

    margin:auto;

    padding:
        125px 7%;
}

.section-label{
    color:var(--gold);

    font-size:9px;

    letter-spacing:5px;

    margin-bottom:18px;
}

.section-title{
    font-family:Georgia,serif;

    font-size:
        clamp(52px,8vw,92px);

    line-height:.86;

    letter-spacing:-3px;

    margin-bottom:60px;
}

.section-title span{
    color:var(--gold);
}


/* =========================================================
   ABOUT
   ========================================================= */

.about{
    position:relative;
}

.about-grid{
    display:grid;

    grid-template-columns:
        .8fr 1.2fr;

    gap:75px;

    align-items:center;
}


/* Profile */

.profile-frame{
    position:relative;

    padding:18px;

    background:
        linear-gradient(
            145deg,
            rgba(216,180,91,.14),
            rgba(0,0,0,.4)
        );

    border:
        1px solid rgba(216,180,91,.35);

    box-shadow:
        0 30px 80px rgba(0,0,0,.55);
}

.profile-frame:before{
    content:"";

    position:absolute;

    top:-11px;
    left:-11px;

    width:80px;
    height:80px;

    border-top:
        2px solid var(--gold);

    border-left:
        2px solid var(--gold);
}

.profile-frame:after{
    content:"";

    position:absolute;

    right:-11px;
    bottom:-11px;

    width:80px;
    height:80px;

    border-right:
        2px solid var(--blue);

    border-bottom:
        2px solid var(--blue);
}

.profile-photo{
    width:100%;

    display:block;

    aspect-ratio:1/1;

    object-fit:cover;
}


/* About text */

.about-content h3{
    font-family:Georgia,serif;

    color:var(--gold);

    font-size:35px;

    margin-bottom:22px;
}

.about-content p{
    color:#b7c0c8;

    font-size:14px;

    line-height:1.9;

    margin-bottom:20px;
}

.about-content strong{
    color:var(--blue2);
}


/* =========================================================
   INFO STRIP
   ========================================================= */

.info-strip{
    margin-top:55px;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    border-top:
        1px solid var(--line);

    border-bottom:
        1px solid var(--line);
}

.info-box{
    padding:25px 20px;

    border-right:
        1px solid var(--line);
}

.info-box:last-child{
    border-right:0;
}

.info-box small{
    display:block;

    color:var(--gray);

    font-size:8px;

    letter-spacing:3px;

    margin-bottom:7px;
}

.info-box strong{
    color:var(--gold2);

    font-family:Georgia,serif;

    font-size:16px;
}


/* =========================================================
   SKILLS
   ========================================================= */

.skills-section{
    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(8,125,154,.045),
            transparent
        );
}

.skills-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:16px;
}

.skill{
    position:relative;

    min-height:230px;

    padding:30px;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #10151a,
            #06080b
        );

    border:
        1px solid rgba(216,180,91,.20);

    transition:.4s;
}

.skill:hover{
    transform:translateY(-8px);

    border-color:
        rgba(98,232,255,.6);

    box-shadow:
        0 25px 60px rgba(0,0,0,.6),
        0 0 30px rgba(98,232,255,.08);
}

.skill-number{
    color:var(--blue);

    font-size:8px;

    letter-spacing:4px;

    margin-bottom:35px;
}

.skill h3{
    color:var(--gold2);

    font-family:Georgia,serif;

    font-size:25px;

    margin-bottom:12px;
}

.skill p{
    color:var(--gray);

    font-size:12px;

    line-height:1.7;
}


/* =========================================================
   CREATIVE WORK
   ========================================================= */

.work-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:18px;
}

.work{
    min-height:270px;

    position:relative;

    padding:32px;

    overflow:hidden;

    background:#07090c;

    border:
        1px solid rgba(216,180,91,.20);

    transition:.4s;
}

.work:hover{
    transform:translateY(-7px);

    border-color:var(--gold);
}

.work-number{
    color:var(--blue);

    font-size:8px;

    letter-spacing:4px;

    margin-bottom:45px;
}

.work h3{
    font-family:Georgia,serif;

    font-size:31px;

    margin-bottom:14px;
}

.work h3 span{
    color:var(--gold);
}

.work p{
    color:var(--gray);

    font-size:12px;

    max-width:500px;
}

.work:after{
    content:"✦";

    position:absolute;

    right:25px;
    bottom:-5px;

    font-size:70px;

    color:var(--blue);

    opacity:.07;
}


/* =========================================================
   VIDEO SECTION
   ========================================================= */

.video-section{
    position:relative;

    background:
        radial-gradient(
            ellipse at center,
            rgba(8,125,154,.07),
            transparent 60%
        );
}

.video-intro{
    max-width:700px;

    color:var(--gray);

    font-size:14px;

    line-height:1.9;

    margin-bottom:60px;
}


/* Category */

.video-category{
    margin-top:65px;
}

.video-heading{
    display:flex;

    align-items:baseline;

    gap:15px;

    margin-bottom:22px;
}

.video-heading h3{
    font-family:Georgia,serif;

    font-size:29px;

    color:var(--gold2);
}

.video-heading span{
    color:var(--blue);

    font-size:8px;

    letter-spacing:3px;
}


/* Video cards */

.video-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:16px;
}

.video-card{
    position:relative;

    min-height:260px;

    display:flex;

    flex-direction:column;

    padding:26px;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #10151a,
            #06080a
        );

    border:
        1px solid rgba(216,180,91,.24);

    transition:.4s;
}

.video-card:hover{
    transform:translateY(-8px);

    border-color:
        rgba(98,232,255,.65);

    box-shadow:
        0 25px 65px rgba(0,0,0,.65),
        0 0 35px rgba(98,232,255,.08);
}

.video-card:before{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    right:-90px;
    top:-90px;

    border:
        1px solid rgba(98,232,255,.25);

    border-radius:50%;
}

.play{
    width:52px;
    height:52px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:
        1px solid rgba(98,232,255,.45);

    border-radius:50%;

    color:var(--blue);

    font-size:15px;

    margin-bottom:auto;

    box-shadow:
        0 0 25px rgba(98,232,255,.05);
}

.video-number{
    color:var(--blue);

    font-size:8px;

    letter-spacing:4px;

    margin-top:25px;
}

.video-card h4{
    font-family:Georgia,serif;

    color:var(--white);

    font-size:24px;

    line-height:1.15;

    margin-top:9px;
}

.video-card p{
    color:var(--gray);

    font-size:8px;

    letter-spacing:2px;

    margin:8px 0 18px;
}

.watch{
    display:block;

    width:100%;

    padding:12px;

    text-align:center;

    color:var(--gold);

    font-size:8px;

    letter-spacing:2px;

    border:
        1px solid rgba(216,180,91,.35);

    transition:.3s;
}

.watch:hover{
    background:var(--gold);

    color:#020304;
}


/* =========================================================
   CONTACT
   ========================================================= */

.contact-section{
    text-align:center;

    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(94,23,36,.10)
        );
}

.contact-intro{
    max-width:650px;

    margin:
        0 auto 45px;

    color:var(--gray);

    font-size:14px;

    line-height:1.9;
}

.contact-grid{
    max-width:850px;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:14px;
}

.contact{
    padding:20px;

    background:#080a0d;

    border:
        1px solid var(--line);

    color:var(--white);

    font-size:9px;

    letter-spacing:2px;

    transition:.35s;
}

.contact:hover{
    color:var(--blue);

    border-color:var(--blue);

    transform:translateY(-4px);

    box-shadow:
        0 0 30px rgba(98,232,255,.08);
}


/* =========================================================
   FOOTER
   ========================================================= */

footer{
    padding:35px 6%;

    text-align:center;

    border-top:
        1px solid var(--line);

    color:#68717a;

    font-size:8px;

    letter-spacing:2px;
}

footer strong{
    color:var(--gold);
}


/* =========================================================
   TABLET
   ========================================================= */

@media(max-width:950px){

    .hero{
        grid-template-columns:1fr;
    }

    .hero-orbit{
        right:-160px;
        opacity:.45;
    }

    .about-grid{
        grid-template-columns:1fr;
    }

    .skills-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

    .video-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    .nav{
        height:64px;
        padding:0 5%;
    }

    .logo{
        font-size:14px;
        letter-spacing:3px;
    }

    .nav-links{
        gap:8px;
    }

    .nav-links a{
        font-size:6px;
        letter-spacing:1px;
    }


    .hero{
        min-height:100vh;

        padding:
            125px 7% 80px;
    }

    .eyebrow{
        font-size:7px;
        letter-spacing:3px;
    }

    .hero h1{
        font-size:72px;
        letter-spacing:-5px;
    }

    .hero-role{
        font-size:11px;
        letter-spacing:2px;
    }

    .hero-mentor{
        font-size:8px;
        letter-spacing:2px;
    }

    .hero-location{
        font-size:7px;
        letter-spacing:2px;
    }

    .hero-buttons{
        flex-direction:column;

        width:185px;
    }

    .hero-orbit{
        width:280px;
        height:280px;

        right:-150px;

        top:68%;

        opacity:.25;
    }

    .hero-orbit:after{
        font-size:85px;
    }


    .section{
        padding:
            90px 6%;
    }

    .section-title{
        font-size:56px;
        margin-bottom:42px;
    }


    .skills-grid,
    .work-grid,
    .video-grid,
    .contact-grid{
        grid-template-columns:1fr;
    }


    .profile-frame{
        padding:12px;
    }


    .about-content h3{
        font-size:29px;
    }

    .about-content p{
        font-size:13px;
    }


    .info-strip{
        grid-template-columns:1fr;
    }

    .info-box{
        border-right:0;

        border-bottom:
            1px solid var(--line);
    }

    .info-box:last-child{
        border-bottom:0;
    }


    .video-card{
        min-height:230px;
    }


    .video-heading h3{
        font-size:24px;
    }

}


/* =========================================================
   VERY SMALL PHONE
   ========================================================= */

@media(max-width:380px){

    .nav-links{
        gap:5px;
    }

    .nav-links a{
        font-size:5px;
    }

    .hero h1{
        font-size:62px;
    }

}

</style>

</head>

    </a>

    <nav class="nav-links">
